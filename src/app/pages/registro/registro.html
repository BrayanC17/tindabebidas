<div class="registro-container">
  <div class="registro-card">
    <h1>Crea tu cuenta</h1>
    <p class="registro-subtitle">Regístrate en TindaBebidas</p>

    @if (error()) {
      <p class="registro-error">{{ error() }}</p>
    }

  <div class="rol-selector">
    <button
      type="button"
      class="rol-card"
      [class.activo]="rol() === 'cliente'"
      (click)="seleccionarRol('cliente')"
    >
      <i class="fa-solid fa-cart-shopping rol-icono"></i>
      <span class="rol-titulo">Soy cliente</span>
      <span class="rol-descripcion">Quiero comprar bebidas</span>
    </button>

      <button
      type="button"
      class="rol-card"
      [class.activo]="rol() === 'vendedor'"
      (click)="seleccionarRol('vendedor')"
    >
      <i class="fa-solid fa-shop rol-icono"></i>
      <span class="rol-titulo">Soy vendedor</span>
      <span class="rol-descripcion">Quiero publicar mis productos</span>
    </button>
  </div>

    @if (rol() === 'vendedor') {
      <label for="nombreNegocio">Nombre de tu negocio</label>
      <br />
      <input
        id="nombreNegocio"
        type="text"
        placeholder="Ej: Licores El Buen Trago"
        [value]="nombreNegocio()"
        (input)="nombreNegocio.set($any($event.target).value)"
      />

      <br />
      <label for="nit">NIT de la empresa</label>
      <br />
      <input
        id="nit"
        type="text"
        placeholder="Ej: 900123456-7"
        [value]="nit()"
        (input)="nit.set($any($event.target).value)"
      />
    }

    <form (ngSubmit)="registrar()">
      <label for="nombre">Nombre completo</label>
      <input
        id="nombre"
        type="text"
        placeholder="Tu nombre"
        [value]="nombre()"
        (input)="nombre.set($any($event.target).value)"
        required
      />

      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        type="email"
        placeholder="tucorreo@ejemplo.com"
        [value]="correo()"
        (input)="correo.set($any($event.target).value)"
        required
      />

      <label for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        type="password"
        placeholder="••••••••"
        [value]="contrasena()"
        (input)="contrasena.set($any($event.target).value)"
        required
      />

      <label for="confirmarContrasena">Confirmar contraseña</label>
      <input
        id="confirmarContrasena"
        type="password"
        placeholder="••••••••"
        [value]="confirmarContrasena()"
        (input)="confirmarContrasena.set($any($event.target).value)"
        required
      />

      <label class="checkbox-label">
        <input
          type="checkbox"
          [checked]="mayorDeEdad()"
          (change)="mayorDeEdad.set($any($event.target).checked)"
        />
        Confirmo que soy mayor de 18 años
      </label>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <p class="registro-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
