<section class="categorias">
  <div class="categorias-titulo">
    <h2>¿Qué <span class="resaltado">se te antoja</span> hoy?</h2>
    <p class="categorias-subtitulo">Explora nuestras categorías y encuentra tu bebida perfecta</p>
  </div>

  <div class="categorias-grid">
    @for (cat of categorias(); track cat.nombre) {
      <div
        class="categoria-card"
        [class.seleccionada]="seleccionada() === cat.nombre"
        [style.background]="cat.color"
        (click)="seleccionar(cat.nombre)"
      >
        <i class="categoria-icono" [class]="cat.icono"></i>
        <p class="categoria-nombre">{{ cat.nombre }}</p>
      </div>
    }
  </div>
</section>
