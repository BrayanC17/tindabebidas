<nav class="navbar">
  <div class="navbar-left">
    <a routerLink="/" class="logo-container">
      <img src="logo.png" alt="TinBebidas" class="logo-img" />
      <span class="logo-texto">TinBebidas</span>
    </a>
    <button class="ubicacion-btn" (click)="detectarUbicacion()" [disabled]="cargandoUbicacion()">
      <i class="fa-solid fa-location-dot"></i>
      <span class="ubicacion-texto">{{ cargandoUbicacion() ? 'Detectando...' : ubicacionService.ciudad() }}</span>
    </button>
    <div class="navbar-search">
      <input
        type="text"
        placeholder="Buscar productos..."
        [value]="busqueda()"
        (input)="busqueda.set($any($event.target).value)"
        (keyup.enter)="buscar()"
      />
      <span class="search-icon" (click)="buscar()"><i class="fa-solid fa-magnifying-glass"></i></span>
    </div>
  </div>

  <div class="navbar-right">
  @if (nombreUsuario()) {
  <div class="usuario-info">
    @if (fotoPerfilUsuario()) {
      <img [src]="fotoPerfilUsuario()" alt="Perfil" class="foto-usuario-navbar" />
    } @else {
      <i class="fa-solid fa-circle-user icono-usuario-navbar"></i>
    }
    <span class="usuario-nombre">{{ nombreUsuario() }}</span>
  </div>

  @if (rolUsuario() === 'vendedor') {
    <a routerLink="/admin" class="link-admin">
      <i class="fa-solid fa-shop"></i> Mi panel
    </a>
  }

  <div class="menu-config-wrapper">
    <button class="btn-config" (click)="toggleMenuConfig()">
      <i class="fa-solid fa-gear"></i>
    </button>

    @if (menuConfigAbierto()) {
      <div class="menu-config-dropdown">
        <a routerLink="/perfil" (click)="menuConfigAbierto.set(false)">
          <i class="fa-solid fa-user-pen"></i> Editar perfil
        </a>
        <button (click)="cerrarSesion()">
          <i class="fa-solid fa-right-from-bracket"></i> Salir
        </button>
      </div>
    }
  </div>
} @else {
  <a routerLink="/login" class="ingreso">
    <span class="icono-usuario"><i class="fa-solid fa-user"></i></span>
    Ingreso
  </a>
}
  <a routerLink="/carrito" class="carrito">
    <i class="fa-solid fa-cart-shopping"></i>
    @if (carritoService.cantidadTotal() > 0) {
      <span class="carrito-badge">{{ carritoService.cantidadTotal() }}</span>
    }
  </a>
</div>
</nav>
