<nav class="navbar">
  <div class="navbar-left">
    <div class="logo-container">
      <img src="logo.png" alt="TinBebidas" class="logo-img" />
      <span class="logo-texto">TinBebidas</span>
    </div>
    <button class="ubicacion-btn" (click)="detectarUbicacion()" [disabled]="cargandoUbicacion()">
      <i class="fa-solid fa-location-dot"></i>
      {{ cargandoUbicacion() ? 'Detectando...' : ubicacionService.ciudad() }}
    </button>
    <div class="navbar-search">
      <input
        type="text"
        placeholder="Buscar productos..."
        [value]="busqueda()"
        (input)="busqueda.set($any($event.target).value)"
      />
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
    </div>
  </div>

  <div class="navbar-right">
  @if (nombreUsuario()) {
    <span class="usuario-nombre">👤 {{ nombreUsuario() }}</span>

    @if (rolUsuario() === 'vendedor') {
      <a routerLink="/admin" class="link-admin">🏪 Mi panel</a>
    }

    <button class="btn-cerrar-sesion" (click)="cerrarSesion()">Salir</button>
  } @else {
    <a routerLink="/login" class="ingreso">
      <span class="icono-usuario"><i class="fa-solid fa-user"></i></span>
    </a>
  }
  <span class="carrito"><i class="fa-solid fa-cart-shopping"></i></span>
</div>
</nav>
