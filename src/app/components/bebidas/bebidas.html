
<hr>
<p>bebidas works!</p>

<div>
  <h2>bebidas disponibles</h2>

  <ul>

    @for ( bebida of bebidas; track bebida ) {
      <li>{{ bebida }}</li>

    }@empty {
      <li>no hay bebidas disponibles</li>
    }

  </ul>

  <input  type="text" placeholder="añadir bebida..." [(ngModel)]="nuevaBebida" />
  <button (click)="addBebida()">añadir</button>
</div>
